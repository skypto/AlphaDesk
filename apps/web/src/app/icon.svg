<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="alpacaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background tile with dual-workspace border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Candlesticks (AlphaDesk Quant Signals) -->
  <!-- Candle 1 -->
  <line x1="16" y1="18" x2="16" y2="34" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <rect x="14" y="21" width="4" height="9" rx="1" fill="#10b981" />

  <!-- Candle 2 -->
  <line x1="23" y1="13" x2="23" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <rect x="21" y="16" width="4" height="11" rx="1" fill="#38bdf8" />

  <!-- Iconic Alpaca Silhouette -->
  <path d="M 44 14 
           C 43 14, 41 18, 40 21
           C 38 18, 36 15, 35 15
           C 34 15, 35 22, 36 26
           C 33 27, 28 30, 27 34
           C 26 38, 29 40, 33 40
           C 35 40, 36 41, 37 44
           L 37 54
           L 54 54
           L 54 42
           C 54 35, 52 30, 50 25
           C 49 22, 50 17, 49 14
           C 48 13, 45 14, 44 14 Z" 
        fill="url(#alpacaGrad)" />

  <!-- Eye -->
  <circle cx="39" cy="31" r="1.5" fill="#0f172a" />
</svg>